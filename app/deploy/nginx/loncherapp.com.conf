# ============================================================================
#  nginx site config — loncherapp.com  (reverse proxy → SchoolPOS.Portal.Web)
#  Place at: /etc/nginx/sites-available/loncherapp.com.conf
#  Enable:   sudo ln -s /etc/nginx/sites-available/loncherapp.com.conf \
#                       /etc/nginx/sites-enabled/
#  The Kestrel app must be listening on 127.0.0.1:5170 (see systemd unit /
#  ASPNETCORE_URLS=http://127.0.0.1:5170). Change the port below if different.
# ============================================================================

# Upstream = the ASP.NET Core (Kestrel) process
upstream schoolpos_portal {
    server 127.0.0.1:5170;
    keepalive 32;
}

# WebSocket upgrade helper (safe even if unused)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# HTTP :80  — ACME challenge + redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name loncherapp.com www.loncherapp.com;

    # Let's Encrypt / certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS :443 — canonical host, proxies to the portal
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name loncherapp.com www.loncherapp.com;

    # --- TLS (issued by certbot; see README) ---
    ssl_certificate     /etc/letsencrypt/live/loncherapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loncherapp.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # certbot also drops recommended options here:
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # top-ups / uploads headroom (Mercado Pago webhook bodies are small)
    client_max_body_size 15m;

    # gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # --- reverse proxy to Kestrel ---
    location / {
        proxy_pass         http://schoolpos_portal;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;     # so the app knows it's HTTPS
        proxy_set_header X-Forwarded-Host  $host;

        # WebSockets / SignalR (harmless if not used)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 15s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering       off;   # stream responses; webhook posts pass straight through
    }

    # Cache static assets served from wwwroot (optional; app also sets versioned URLs)
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        proxy_pass http://schoolpos_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}

