<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" role="img" aria-label="Recarga de saldo escolar en el teléfono">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- soft backdrop -->
  <ellipse cx="210" cy="180" rx="190" ry="150" fill="#eff6ff"/>
  <circle cx="70" cy="70" r="10" fill="#bfdbfe"/>
  <circle cx="360" cy="90" r="7" fill="#bfdbfe"/>
  <circle cx="350" cy="250" r="12" fill="#dbeafe"/>

  <!-- phone -->
  <g>
    <rect x="120" y="48" width="180" height="250" rx="26" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="176" y="60" width="68" height="9" rx="4.5" fill="#eef2f7"/>

    <!-- balance card -->
    <rect x="140" y="86" width="140" height="86" rx="16" fill="url(#card)"/>
    <text x="156" y="112" font-family="system-ui, Arial, sans-serif" font-size="12" fill="#dbeafe">Saldo disponible</text>
    <text x="156" y="142" font-family="system-ui, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">$850</text>
    <text x="248" y="142" font-family="system-ui, Arial, sans-serif" font-size="12" fill="#dbeafe">MXN</text>
    <circle cx="262" cy="106" r="10" fill="#ffffff" opacity="0.25"/>

    <!-- rows -->
    <rect x="140" y="188" width="140" height="14" rx="7" fill="#f1f5f9"/>
    <rect x="140" y="212" width="110" height="14" rx="7" fill="#f1f5f9"/>
    <rect x="140" y="236" width="128" height="14" rx="7" fill="#f1f5f9"/>

    <!-- recharge button -->
    <rect x="140" y="262" width="140" height="24" rx="12" fill="#2563eb"/>
    <text x="210" y="278" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Recargar</text>
  </g>

  <!-- coins -->
  <g>
    <ellipse cx="86" cy="240" rx="30" ry="11" fill="#f59e0b" opacity="0.35"/>
    <circle cx="86" cy="224" r="22" fill="url(#coin)" stroke="#d97706" stroke-width="2"/>
    <text x="86" y="230" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">$</text>
    <circle cx="60" cy="256" r="16" fill="url(#coin)" stroke="#d97706" stroke-width="2"/>
    <text x="60" y="262" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">$</text>
  </g>

  <!-- apple (brand mark) -->
  <g transform="translate(300 210)">
    <path d="M20 14 C 16 8, 9 9, 8 16 C 7 22, 11 35, 17 35 C 19 35, 19 34, 20 34 C 21 34, 21 35, 23 35 C 29 35, 33 22, 32 16 C 31 9, 24 8, 20 14 Z"
          fill="#ffffff" stroke="#efa43b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M21 13 C 22 8, 26 6, 30 8" fill="none" stroke="#efa43b" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M19 13 C 15 7, 9 8, 12 13 C 15 16, 19 15, 19 13 Z" fill="#5fb03a"/>
  </g>
</svg>
