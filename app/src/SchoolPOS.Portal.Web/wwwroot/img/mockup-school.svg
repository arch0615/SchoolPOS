  <!-- donut -->
  <rect x="332" y="166" width="159" height="164" rx="12" fill="#f8fafc"/>
  <text x="348" y="190" font-family="system-ui, Arial" font-size="12" font-weight="700" fill="#111827">Formas de pago</text>
  <g transform="translate(411 258)">
    <circle r="40" fill="none" stroke="#e2e8f0" stroke-width="16"/>
    <circle r="40" fill="none" stroke="#2563eb" stroke-width="16" stroke-dasharray="176 76" transform="rotate(-90)"/>
    <circle r="40" fill="none" stroke="#f59e0b" stroke-width="16" stroke-dasharray="76 176" stroke-dashoffset="-176" transform="rotate(-90)"/>
