    <rect x="188" y="86" width="145" height="64" rx="12" fill="#fef3c7"/>
    <text x="202" y="110" font-size="11" fill="#92400e">Recargas</text><text x="202" y="134" font-size="20" font-weight="800" fill="#d97706">$8,900</text>
    <rect x="346" y="86" width="145" height="64" rx="12" fill="#dcfce7"/>
    <text x="360" y="110" font-size="11" fill="#166534">Conciliado</text><text x="360" y="134" font-size="20" font-weight="800" fill="#16a34a">100%</text>
  </g>
  <!-- bar chart -->
  <rect x="30" y="166" width="290" height="164" rx="12" fill="#f8fafc"/>
  <text x="46" y="190" font-family="system-ui, Arial" font-size="12" font-weight="700" fill="#111827">Ventas por día</text>
  <g fill="#2563eb">
    <rect x="52" y="270" width="24" height="44" rx="4"/>
    <rect x="92" y="248" width="24" height="66" rx="4"/>
    <rect x="132" y="228" width="24" height="86" rx="4"/>
    <rect x="172" y="256" width="24" height="58" rx="4"/>
    <rect x="212" y="214" width="24" height="100" rx="4"/>
    <rect x="252" y="238" width="24" height="76" rx="4"/>
