<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" role="img" aria-label="Panel de la escuela: ventas, recargas y conciliación">
  <defs>
    <filter id="ss" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1e293b" flood-opacity="0.14"/></filter>
  </defs>
  <rect x="14" y="14" width="492" height="332" rx="16" fill="#ffffff" filter="url(#ss)"/>
  <path d="M14 30 a16 16 0 0 1 16 -16 h460 a16 16 0 0 1 16 16 v14 h-492 z" fill="#f1f5f9"/>
  <circle cx="34" cy="28" r="4" fill="#ef4444"/><circle cx="48" cy="28" r="4" fill="#f59e0b"/><circle cx="62" cy="28" r="4" fill="#10b981"/>
  <rect x="86" y="21" width="360" height="14" rx="7" fill="#e2e8f0"/>
  <text x="34" y="72" font-family="system-ui, Arial" font-size="14" font-weight="700" fill="#111827">Resumen de la escuela</text>
  <!-- KPI tiles -->
